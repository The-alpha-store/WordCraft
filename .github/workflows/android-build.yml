name: Android ARM64 build

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'rust/**'
      - 'upstream/wordcraft/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'rust-toolchain.toml'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        # ubuntu-latest already ships the Android SDK, so no setup-android action is needed
        # (that action fails trying to install the removed "tools" package).
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install Rust and Android target
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android
          rustup default 1.95.0
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Check Cargo manifest structure
        run: cargo metadata --no-deps --format-version 1 --manifest-path rust/wordcraft_android_bridge/Cargo.toml > /tmp/wordcraft-cargo-metadata.json
      - name: Build debug APK (includes ARM64 Rust library)
        # gradlew loses its executable bit when uploaded from a phone or unzipped, so set it here.
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Unit tests
        # Pure-logic checks (ribbon and parameter parsing). Reported, but never blocks the APK.
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
