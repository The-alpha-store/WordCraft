[package]
name = "wordcraft_android_bridge"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Keep this JNI adapter as its own Cargo workspace. The vendored upstream
# WordCraft workspace remains untouched in upstream/wordcraft.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
serde_json = "1"
wordcraft-engine = { path = "../../upstream/wordcraft/crates/engine" }

# The bridge is its own Cargo workspace, so upstream's workspace-level [patch] does not apply
# to it. craft-pdf requires this exact krilla fork (same rev as upstream/wordcraft/Cargo.toml).
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
